<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Codex Relay 연결</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f4ef;color:#193029;font-family:"Segoe UI","Malgun Gothic",sans-serif}
    main{width:min(460px,100%);padding:38px;border:1px solid #d9dfda;border-radius:22px;background:#fff;box-shadow:0 24px 70px rgba(26,52,43,.12);text-align:center}
    .mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 20px;border-radius:15px;background:#173f33;color:#dff06b;font:700 24px Georgia,serif}
    h1{margin:0;font:500 28px Georgia,"Times New Roman",serif}p{margin:12px 0 24px;color:#718078;font-size:13px;line-height:1.7}
    a{display:block;padding:14px 18px;border-radius:12px;background:#173f33;color:white;text-decoration:none;font-weight:700}
    a:hover{background:#245744}.meta{margin-top:14px;color:#9aa49f;font-size:10px}.error{color:#a04b36}
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>Codex Relay</h1>
    <p id="message">현재 외부 접속 주소를 확인하고 있습니다.</p>
    <a id="open" href="#" hidden>현재 주소로 접속</a>
    <div id="meta" class="meta"></div>
  </main>
  <script>
    fetch("./current.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(data=>{
      if(!data.url) throw new Error("offline");
      const link=document.querySelector("#open");
      link.href=data.url;
      link.hidden=false;
      document.querySelector("#message").textContent="현재 연결 주소를 찾았습니다. 잠시 후 자동으로 이동합니다.";
      document.querySelector("#meta").textContent=data.updatedAt ? "최근 갱신: "+new Date(data.updatedAt).toLocaleString("ko-KR") : "";
      setTimeout(()=>location.replace(data.url),1800);
    }).catch(()=>{
      const message=document.querySelector("#message");
      message.textContent="현재 PC의 외부 연결이 실행되지 않았습니다.";
      message.className="error";
    });
  </script>
</body>
</html>
